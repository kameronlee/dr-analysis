# Single configuration for retina_fragility. Keys mirror retina_fragility/config.py DEFAULTS
# (unknown keys are rejected). exp_e geometry/label fields are source-verified; see
# docs/DRAC_DATA_DICTIONARY.md. Changes after outcome data exist must be logged as amendments.
project:
  base_seed: 20260929
  output_root: outputs
  n_workers: 1
data:
  manifest: data/manifests/octa500_manifest.csv
  input_roots:
  - data/raw
  label_maps:
    vessel:
      mode: binary
      values: []
      background_values:
      - 0
    large_vessel:
      mode: binary
      values: []
      background_values:
      - 0
    faz:
      mode: binary
      values: []
      background_values:
      - 0
  disease_map:
    NORMAL: normal
    DR: dr
  sex_map:
    M: 1
    F: 0
    Male: 1
    Female: 0
    male: 1
    female: 0
  primary_dataset: OCTA500
  subject_id_policy: image_is_subject
  expected_geometry:
    '3':
      shape:
      - 304
      - 304
      pixel_size_um: 9.868421052631579
    '6':
      shape:
      - 400
      - 400
      pixel_size_um: 15.0
  pixel_size_rel_tolerance: 0.005
calibration:
  n_per_fov:
    '3': 10
    '6': 10
  eligible_group: normal
  percentile: 95.0
  weighting: equal_image
  frozen_file: outputs/calibration/calibration.json
qc:
  octa500_graph_n_per_fov:
    '3': 10
    '6': 10
  octa500_graph_selection_purpose: OCTA_GRAPH_QC
# OCTA-500 data contract, fixed before any OCTA-500 outcome existed:
# docs/OCTA500_PREANALYSIS_NOTE_2026-09-30.md (D1-D5). Labels were drawn on the
# paper's B5 (OCTA max projection ILM-OPL). Vessel = GT_Capillary OR GT_LargeVessel.
octa500:
  source_catalog: data/manifests/octa500_source_catalog.csv
  primary_projection: octa_ilm_opl
  context_projections:
  - octa_full
  - octa_opl_bm
  vessel_label: capillary
  large_vessel_label: large_vessel
  faz_label: faz
  label_split: public
  seg_split_ranges:
    train:
    - [10001, 10240]
    - [10301, 10440]
    val:
    - [10241, 10250]
    - [10441, 10450]
    test:
    - [10251, 10300]
    - [10451, 10500]
  alignment_min_identity_fraction: 0.95
analysis_mask:
  border_band_um: 50.0
  exclude_faz: true
graph:
  junction_merge_distance_px: 2.0
  force_2x2_blocks_as_junctions: true
  border_band_px: 1
  faz_inside_fraction: 0.5
  spur_length_factor: 2.0
  spur_prune_passes: 1
  min_fragment_length_um: 50.0
  min_fragment_length_px: null
stress:
  step_frac: 0.01
  random_repetitions: 100
  orders:
  - adaptive_betweenness
  - random
  - static_betweenness
  - width
  - forman
  primary_order: adaptive_betweenness
  betweenness_backend: igraph
  tie_rel_quantum: 1.0e-09
  q_eval: 0.1
  s_threshold: 0.5
  compute_coverage: true
  coverage_orders:
  - adaptive_betweenness
  - random
  coverage_geometry: vessel_territory
pipeline:
  crop_center_mm: null
  save_raw_graph: false
  overlays: true
  skip_existing: true
stats:
  n_boot: 2000
  alpha: 0.05
  fi_column: FI_adaptive_betweenness
  baseline_primary:
  - fov_6mm
  - age
  - sex_male
  - vessel_density
  - faz_area_mm2
  - loop_density_per_mm2
  sensitivity_sets:
    fractal_substituted:
    - fov_6mm
    - age
    - sex_male
    - vessel_density
    - faz_area_mm2
    - fractal_dimension
    fractal_added:
    - fov_6mm
    - age
    - sex_male
    - vessel_density
    - faz_area_mm2
    - loop_density_per_mm2
    - fractal_dimension
  standardize_continuous: true
  min_events_per_class: 10
  separation_prob_tol: 1.0e-08
  max_abs_coef_sd: 15.0
  cv:
    n_splits: 5
    n_repeats: 10
    C: 1.0
  holm_families:
    H1_H2_secondary:
    - A:FI_adaptive_betweenness
    - D:G10
    - D:qc_adaptive_betweenness
    H4:
    - C:wilcoxon_z_gt_0
exp_a:
  features:
  - FI_adaptive_betweenness
  - FI_random
  - FIperf_adaptive_betweenness
  - vessel_density
  - loop_density_per_mm2
  - fractal_dimension
  curve_grid: 101
exp_c:
  repetitions: 50
  density_metric: graph_length_density_mm_per_mm2
  tolerance_rel: 0.02
  max_donors: null
  fi_order: adaptive_betweenness
exp_d:
  orders:
  - adaptive_betweenness
  - static_betweenness
  - width
  - forman
exp_e:
  manifest: data/manifests/drac_manifest.csv
  labels_corrected_version: true
  pixel_size_um: 11.71875
  fov_mm: 12.0
  geometry_source: https://doi.org/10.1016/j.patter.2024.100929
  min_fragment_length_px: 5.0
  faz:
    mode: disk
    radius_px: 20
    center: image_center
  min_qc_audited: 30
  max_qc_fail_fraction: 0.2
  segmenters:
  - frangi
  - unet
  baseline:
  - vessel_density
  - faz_area_mm2
  - loop_density_per_mm2
  n_permutations: 10000
  grouping_level: image
  cv:
    n_splits: 5
    n_repeats: 10
    C: 1.0
exp_f:
  embedding_models:
  - resnet50
  - dinov2_vits14
  n_splits: 5
  C: 1.0
  fragility_features:
  - FI_adaptive_betweenness
  - FI_random
  - G10_adaptive_betweenness
  - qc_adaptive_betweenness
  segmenter: frangi
embeddings:
  image_size: 224
  batch_size: 16
  weights: imagenet
  allow_download: false
  device: cpu
segmentation:
  frangi:
    # Pre-outcome amendment 2026-09-30 (docs/reviews/resume_review.md D6).
    # No DRAC FI, grade association or QC decision existed. The v1 QC export
    # (outputs/drac_qc/frangi, Slurm 1395755) used skimage_unnormalized with
    # sigmas [1, 1.5, 2, 3]. It missed broad vessels because skimage's Hessian is
    # not sigma²-normalised. The v1 outputs are retained. Revised masks need
    # fresh hash-bound human review.
    implementation: frangi1998_normalized
    sigmas:
    - 1.0
    - 1.5
    - 2.0
    - 3.0
    - 4.0
    - 6.0
    beta: 0.5
    black_ridges: false
    threshold: otsu
    threshold_scale: 1.0
    min_object_px: 20
  unet:
    base_channels: 16
    depth: 4
    epochs: 60
    lr: 0.001
    batch_size: 4
    patch_size: 256
    threshold: 0.5
    threshold_scale: 1.0
    device: cpu
    seed_purpose: unet
experiment0:
  full:
    grid_n: 30
    tree_depth: 9
    seeds: 20
  quick:
    grid_n: 12
    tree_depth: 6
    seeds: 5
  random_repetitions_per_seed: 1
ablations:
  step_frac:
  - 0.01
  - 0.02
  - 0.05
  spur_length_factor:
  - 0.0
  - 1.0
  - 2.0
  min_fragment_length_um:
  - 0.0
  - 50.0
  - 100.0
  d_percentile:
  - 50.0
  - 75.0
  - 95.0
  seg_threshold_scale:
  - 0.9
  - 1.0
  - 1.1
  crop_center_mm:
  - null
  - 3.0
  # centerline = guide-compatible pixel-path coverage (FIperf/P0 are secondary)
  coverage_geometry:
  - vessel_territory
  - centerline
